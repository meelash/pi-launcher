# Builds, tests and publishes a release when a version tag is pushed:
#   git tag v1.0 && git push origin v1.0
# The card includes the programs from pi-typing and pi-graphcalc, checked out
# next to this repository at the refs below (default: their default branch).
name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TYPING_REF: ''     # e.g. v1.4
  GRAPHCALC_REF: ''  # e.g. v1.0

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: pi-launcher

      - uses: actions/checkout@v4
        with:
          repository: meelash/pi-typing
          ref: ${{ env.TYPING_REF }}
          submodules: true
          path: pi-typing

      - uses: actions/checkout@v4
        with:
          repository: meelash/pi-graphcalc
          ref: ${{ env.GRAPHCALC_REF }}
          submodules: true
          path: pi-graphcalc

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pil python3-fonttools zlib1g-dev fdisk dosfstools mtools xz-utils zip

      # The Arm toolchain (~150 MB) is downloaded by each Makefile into tools/.
      - name: Toolchain name
        id: toolchain
        run: echo "name=$(sed -n 's/^TC_NAME *:= *//p' pi-launcher/Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            pi-launcher/tools
            pi-typing/tools
            pi-graphcalc/tools
          key: ${{ steps.toolchain.outputs.name }}-all

      - name: Simulator tests
        run: make -C pi-launcher test

      - name: Build SD card image (menu and programs)
        run: make -C pi-launcher

      - name: Build debug kernel
        run: make -C pi-launcher debug

      - name: Package
        id: package
        run: |
          version="${{ github.ref_name }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd pi-launcher && scripts/package-release.sh "$version"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pi-launcher
          gh release create "${{ steps.package.outputs.version }}" build/release/* \
            --verify-tag \
            --title "Pi Apps ${{ steps.package.outputs.version }}" \
            --notes-file build/release-notes.md
